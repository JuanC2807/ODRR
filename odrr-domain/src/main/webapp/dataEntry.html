<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2a2a2a;
            color: #ffffff;
            padding: 20px;
        }
        
        /* Header styling */
        h1 {
            background-color: #000000;
            padding: 30px;
            margin: -20px -20px 30px -20px;
            font-size: 2.5rem;
            font-weight: 400;
        }
        
        /* Form container */
        form {
            max-width: 700px;
            margin: 0 auto;
            background-color: #7a7a7a;
            padding: 40px;
            border-radius: 8px;
        }
        
        /* Label styling */
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .required {
            color: #ff4444;
        }
        
        /* Input and select styling */
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #a8a8a8;
            border: none;
            border-radius: 4px;
            color: #000000;
            font-size: 1rem;
        }
        
        input[type="text"]::placeholder,
        input[type="email"]::placeholder {
            color: #4a4a4a;
        }
        
        /* Select dropdown arrow */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }
        
        /* Button container */
        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        
        /* Button styling */
        input[type="submit"],
        input[type="reset"] {
            padding: 15px 50px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
            width: auto;
            margin-bottom: 0;
        }
        
        input[type="submit"] {
            background-color: #2ecc71;
            color: #000000;
            font-weight: 600;
        }
        
        input[type="reset"] {
            background-color: #9a9a9a;
            color: #000000;
            font-weight: 600;
        }
        
        input[type="submit"]:hover,
        input[type="reset"]:hover {
            opacity: 0.8;
        }
        
        /* Remove br tags spacing */
        br {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Welcome to Original Document Return Request Form</h1>
    <form action="dataEntry" method="POST">
        <!--First Name input-->
        <label for="firstName">First Name <span class="required">*</span></label>
        <input type="text" id="firstName" name="firstName" placeholder="John" required>
        
        <!--Last Name input-->
        <label for="lastName">Last Name <span class="required">*</span></label>
        <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
        
        <!--Gender-->
        <label for="gender">Gender <span class="required">*</span></label>
        <select id="gender" name="gender" required>
            <option value="" disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        
        <!--Immigrant ID-->
        <label for="immigrant_ID">Immigrant ID <span class="required">*</span></label>
        <input type="text" id="immigrant_ID" name="immigrant_ID" placeholder="F012" required>
        
        <!--Dependent Name-->
        <label for="dependent">Dependent</label>
        <input type="text" id="dependent" name="dependent" placeholder="Bozo">
        
        <!--Date of Birth-->
        <label for="dateOfBirth">DOB <span class="required">*</span></label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" required>
        
        <!--Email-->
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="john123@funk.com" required>
        
        <!--Document-->
        <label for="requestedDocument">Document <span class="required">*</span></label>
        <select id="requestedDocument" name="requestedDocument" required>
            <option value="" disabled selected>Select Requested Document</option>
            <option value="Birth Certificate">Birth Certificate</option>
            <option value="Passport">Passport</option>
        </select>
        
        <div class="button-group">
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </div>
    </form>
</body>
</html>
